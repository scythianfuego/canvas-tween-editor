<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Linked timelines</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="tweenpolyline.js"></script>
    <script defer src="tweeneditor.js"></script>
    <script defer src="multi.js"></script>
  </head>
  <body>
    <h1>Linked timelines</h1>
    <p>Click to add a point, drag to move it, scroll to zoom, and right-drag to pan.</p>
    <h2>Position</h2>
    <div id="position"></div>
    <h2>Scale</h2>
    <div id="scale"></div>
    <h2>Opacity</h2>
    <div id="opacity"></div>
    <output id="cursor"></output>
  </body>
</html>
